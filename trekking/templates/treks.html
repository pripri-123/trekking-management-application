{% extends 'base.html' %}
{% block title %}
    Treks Page
{% endblock %}
{% block content %}
<h1>Treks Page</h1>
<table class="table table-hover table-dark">
    <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Location</th>
            <th scope="col">Duration</th>
            <th scope="col">Options</th>
        </tr>
    </thead>
    <tbody>
            {% for trek in treks%}
        <tr>
            <td>{{trek.id}}</td>
            <td>{{trek.name}}</td>
            <td>{{trek.location}}</td>
            <td>{{trek.duration}}</td>
            <td>
                <button class="btn btn-outline btn-info">More Info</button>
                <button class="btn btn-outline btn-success">Join Trek</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<p> {{ location }}</p>
{% endblock %}
